<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 9 Lists Practice Lab</title>
<style>
:root{--p:#4f2d7f;--g:#f5b924;--bg:#f7f5fb;--ok:#e7f6e6;--bad:#fde8e8;--ink:#20232a}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}.head{background:var(--p);color:#fff;padding:22px;border-bottom:6px solid var(--g)}.wrap{max-width:1020px;margin:auto;padding:20px}.card{background:#fff;margin:18px 0;padding:20px;border-radius:16px;box-shadow:0 3px 12px #0001}.student{border:3px solid var(--g)}label{font-weight:bold}input,select{padding:10px;border:2px solid var(--p);border-radius:8px;font-size:16px;margin:6px}.lesson{display:none}.lesson.active{display:block}.q{border-left:6px solid var(--p);padding:14px;margin:16px 0;background:#faf9fd}.opts button,.nav button,.codebtn{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.correct{background:var(--ok)!important;border-color:#3a9b43!important}.wrong{background:var(--bad)!important;border-color:#c74a4a!important}.feedback{font-weight:bold;margin-top:8px}.purple{background:var(--p);color:#fff;border:3px solid var(--g);padding:15px;border-radius:12px}.purple textarea{width:100%;min-height:180px;font:15px Consolas,monospace;padding:12px;border-radius:9px}.nav{display:flex;gap:12px;margin-top:18px}.nav button,.codebtn{background:var(--p);color:#fff;border-color:var(--g);text-align:center;font-weight:bold}.pill{display:inline-block;background:var(--g);padding:5px 10px;border-radius:99px;font-weight:bold}.result{font-size:22px;font-weight:bold}.small{font-size:14px}.submit-ok{padding:12px;border-radius:10px;background:var(--ok);font-weight:bold;display:none}.scorebox{font-size:28px;text-align:center;padding:18px}.note{background:#fff4d6;border-left:5px solid var(--g);padding:10px;margin:10px 0}
</style></head><body>
<div class="head"><div class="wrap"><h1>Chapter 9 — Lists Practice Lab</h1><p>Lists • Tuples • List Functions • Iteration • Sequential & Binary Search</p></div></div>
<main class="wrap"><div class="card student"><h2>Student Information</h2><label>First and Last Name <input id="student" size="28" placeholder="First Last"></label><label>Class Period <select id="period"><option value="">Choose...</option><option>1st Block</option><option>2nd Block</option><option>3rd Block</option><option>4th Block</option></select></label><p class="small">Enter your information before beginning. Your final percentage can be submitted to the class grade form at the end.</p></div><div id="app"></div></main>
<iframe name="gradeTarget" style="display:none"></iframe>
<script>
const lessons=[
{title:'Lesson 1 — Lists & Tuples',qs:[
['Which code correctly creates a list named marbles containing red, green, and blue?',['marbles = ["red", "green", "blue"]','marbles = ("red", "green", "blue")','marbles = [red, green, blue]','marbles = list.create("red", "green", "blue")'],'marbles = ["red", "green", "blue"]','Correct! Python lists use square brackets, and string values need quotation marks.','Lists use [ ]. A tuple uses ( ), and unquoted words would be treated as variable names.'],
['Which data types can a Python list store?',['Integers only','Strings only','Booleans only','Integers, strings, Booleans, and even mixed types'],'Integers, strings, Booleans, and even mixed types','Correct! Python lists can hold many data types, including a mixture in the same list.','Python lists are flexible. The chapter specifically shows mixed data types in one list.'],
['Given marbles = ["red","green","blue"], what does marbles[1] return?',['red','green','blue','1'],'green','Correct! Indexes start at 0, so index 1 is the second item: green.','Remember: first item = index 0, second item = index 1.'],
['After marbles[1] = "yellow", what is the list?',['["red","yellow","blue"]','["yellow","green","blue"]','["red","green","yellow"]','The list cannot be changed'],'["red","yellow","blue"]','Correct! A list is mutable, so assigning to index 1 replaces the second item.','Index 1 points to the second item. Lists can be changed after creation.'],
['If marbles = ["red","green","blue","yellow","black","white"], what does marbles[2:5] return?',['["blue","yellow","black"]','["green","blue","yellow"]','["blue","yellow","black","white"]','["yellow","black"]'],'["blue","yellow","black"]','Correct! A slice starts at index 2 and stops BEFORE index 5, so it gets indexes 2, 3, and 4.','Slice rule: START is included; STOP is excluded.']
],scenario:'Create a list named <b>myHobbies</b> with at least 3 string items. Print the second item. Change the third item to "guitar", then print the first two items using a slice.',check:c=>/myHobbies\s*=\s*\[[^\]]+\]/.test(c)&&/print\s*\(\s*myHobbies\s*\[\s*1\s*\]\s*\)/.test(c)&&/myHobbies\s*\[\s*2\s*\]\s*=\s*["']guitar["']/.test(c)&&/print\s*\(\s*myHobbies\s*\[\s*0?\s*:\s*2\s*\]\s*\)/.test(c),pass:'Great! You created a list, used index 1 for the second item, updated index 2, and used a slice that stops before index 2.',hint:'Look for four pieces: myHobbies = [...], print(myHobbies[1]), myHobbies[2] = "guitar", and print(myHobbies[0:2]).'},
{title:'Lesson 2 — List Functions',qs:[
['Which expression returns the number of items in marbles?',['len(marbles)','marbles.length','marbles.size()','size(marbles)'],'len(marbles)','Correct! len(marbles) returns the number of elements.','Use Python’s built-in len() function with the list inside parentheses.'],
['Which statement adds "yellow" to the END of marbles?',['marbles.append("yellow")','marbles.insert(0,"yellow")','marbles.pop("yellow")','marbles.add("yellow")'],'marbles.append("yellow")','Correct! append() adds one new value to the end of a list.','append means add to the end. insert() adds at a chosen index.'],
['Which method removes all items from a list?',['clear()','pop()','remove()','delete()'],'clear()','Correct! clear() leaves the list empty.','pop() removes one indexed item; remove() deletes the first matching value.'],
['Which method removes the item at a chosen index AND returns that item?',['pop(index)','remove(value)','clear()','reverse()'],'pop(index)','Correct! pop(index) removes by position and returns the removed value.','Think: pop an item out of a specific position.'],
['What does result store here? marbles=["red","green","blue"]; result = "green" in marbles',['Boolean True','string green','integer 1','a one-item list'],'Boolean True','Correct! The in keyword asks a True/False membership question.','The in expression does not return the item itself. It answers whether the value is present.']
],scenario:'Start with <code>colors = ["red", "green", "blue"]</code>. Append "yellow", pop index 0 into a variable named removed, and print whether "green" is in colors.',check:c=>/colors\s*=\s*\[/.test(c)&&/colors\.append\s*\(\s*["']yellow["']\s*\)/.test(c)&&/removed\s*=\s*colors\.pop\s*\(\s*0\s*\)/.test(c)&&/print\s*\([^\n]*["']green["']\s+in\s+colors/.test(c),pass:'Nice! append() added to the end, pop(0) removed the first item and returned it, and in produced a Boolean membership test.',hint:'Use colors.append("yellow"), removed = colors.pop(0), and print("green" in colors).'},
{title:'Lesson 3 — Iterating Over Lists',qs:[
['What is one limitation of for marble in marbles when compared with numeric-index traversal?',['You do not automatically know the numeric index','It cannot visit every item','It cannot print values','It only works on tuples'],'You do not automatically know the numeric index','Correct! Direct traversal gives you each value, but not the numeric position unless you track it separately.','The chapter contrasts item traversal with index-based traversal when position matters.'],
['Which loop visits every valid numeric index in marbles?',['for i in range(0,len(marbles)):','for i in marbles:','for i in [0,len(marbles)]:','while(marbles):'],'for i in range(0,len(marbles)):','Correct! range(0, len(marbles)) produces indexes 0 through len(marbles)-1.','Remember that range() stops before its stop value, so len(marbles) is perfect here.'],
['For marbles=["red","blue","green","orange","yellow"], what prints for range(2,4)?',['green orange','blue green','green orange yellow','red blue green'],'green orange','Correct! range(2,4) uses indexes 2 and 3 only.','The stop value 4 is not included.'],
['What indexes are used by range(0,len(marbles),3) for a 5-item list?',['0 and 3','0,1,2','3 and 4','0,3,6'],'0 and 3','Correct! Start at 0 and jump by 3. Index 6 would be beyond the stop value.','The third range value is the step size.'],
['Why does for sport in esports: sport="Centipede" NOT replace every list item?',['sport is only the loop variable; assigning to it does not assign to esports[index]','Lists cannot be changed','Strings cannot be changed','for loops cannot update data'],'sport is only the loop variable; assigning to it does not assign to esports[index]','Correct! To change the actual list, assign to esports[i] while iterating with numeric indexes.','The loop variable receives each value, but it is not the list position itself.']
],scenario:'Create <code>colors = ["red","blue","green"]</code>. Use a numeric-index loop to change every item in the list to "purple". Print the final list.',check:c=>/colors\s*=\s*\[/.test(c)&&/for\s+\w+\s+in\s+range\s*\(\s*0\s*,\s*len\s*\(\s*colors\s*\)\s*\)/.test(c)&&/colors\s*\[\s*\w+\s*\]\s*=\s*["']purple["']/.test(c)&&/print\s*\(\s*colors\s*\)/.test(c),pass:'Correct! Numeric-index traversal lets you assign directly to colors[i], so the actual list items change.',hint:'Use for i in range(0, len(colors)): and inside it assign colors[i] = "purple".'},
{title:'Lesson 4 — Sequential & Binary Search',qs:[
['Which search works on unsorted data?',['Sequential search','Binary search','Both','Neither'],'Sequential search','Correct! Sequential search checks items one at a time and does not require sorted data.','Binary search depends on ordered data so it can discard half safely.'],
['What looping structure best describes a sequential search in this chapter?',['A single for loop','Nested for loops','An outer while plus inner for','Only if statements'],'A single for loop','Correct! A typical sequential search uses one for loop to compare each element in order.','Sequential means check one element after another.'],
['How does binary search improve performance on sorted data?',['It discards half of the remaining possible elements after each comparison','It checks every item faster','It sorts the list during every pass','It uses random indexes'],'It discards half of the remaining possible elements after each comparison','Correct! Halving the search area is the key advantage of binary search.','Think: check the middle, then throw away the half that cannot contain the target.'],
['What is the middle-index formula used in this chapter?',['(highIndex + lowIndex) // 2','highIndex - lowIndex','lowIndex + 1','highIndex / 2'],'(highIndex + lowIndex) // 2','Correct! // keeps the result as an integer index by dropping the fractional part.','The midpoint is based on both current boundaries, not just one.'],
['If the middle value is TOO HIGH compared with the target, what should binary search do?',['highIndex = middleIndex - 1','lowIndex = middleIndex + 1','highIndex = middleIndex + 1','stop immediately and report found'],'highIndex = middleIndex - 1','Correct! A value that is too high means the target must be to the left, so move the high boundary below the midpoint.','Too high → move HIGH left. Too low → move LOW right.']
],scenario:'Write a sequential search for <code>numbers = [15, 9, 1, 14, 12, 8]</code> that searches for target 12. Use a numeric-index for loop. When found, print the index and break.',check:c=>/numbers\s*=\s*\[/.test(c)&&/target\s*=\s*12/.test(c)&&/for\s+\w+\s+in\s+range\s*\(\s*0\s*,\s*len\s*\(\s*numbers\s*\)/.test(c)&&/numbers\s*\[\s*\w+\s*\]\s*==\s*target/.test(c)&&/break/.test(c),pass:'Great! Your sequential search checks indexes from the beginning and stops when it finds 12. In this list, 12 is at index 4, so it takes 5 comparisons.',hint:'Use for i in range(0, len(numbers)): then test if numbers[i] == target, print i, and break.'}
];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let mcEarned=0, codeEarned=0; const totalPoints=100; let done=new Set(),codeDone=new Set(); const app=document.getElementById('app');
lessons.forEach((L,li)=>{let sec=document.createElement('section');sec.className='lesson card'+(li===0?' active':'');sec.id='l'+li;sec.innerHTML=`<span class="pill">Lesson ${li+1}</span><h2>${L.title}</h2><p>Each multiple-choice question is worth 4 points. The coding check is worth 5 points.</p>`;L.qs.forEach((q,qi)=>{let id=`${li}-${qi}`,d=document.createElement('div');d.className='q';d.innerHTML=`<b>${qi+1}. ${q[0]}</b><div class="opts"></div><div class="feedback"></div>`;let opts=d.querySelector('.opts');shuffle(q[1]).forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(done.has(id))return;if(o===q[2]){b.classList.add('correct');d.querySelector('.feedback').textContent='✓ '+q[3];done.add(id);mcEarned+=4;Array.from(opts.children).forEach(x=>x.disabled=true)}else{b.classList.add('wrong');d.querySelector('.feedback').textContent='✗ '+q[4]+' Try again.';setTimeout(()=>b.classList.remove('wrong'),700)}};opts.appendChild(b)});sec.appendChild(d)});let c=document.createElement('div');c.className='purple';c.innerHTML=`<h3>Coding Check — 5 points</h3><p>${L.scenario}</p><textarea id="code${li}" placeholder="Type your Python code here..."></textarea><button class="codebtn" onclick="checkCode(${li})">Check My Code</button><div id="cf${li}" class="feedback"></div>`;sec.appendChild(c);let nav=document.createElement('div');nav.className='nav';if(li>0)nav.innerHTML+=`<button onclick="go(${li-1})">← Previous</button>`;nav.innerHTML+=li<3?`<button onclick="go(${li+1})">Next Lesson →</button>`:`<button onclick="finish()">Finish & See Results</button>`;sec.appendChild(nav);app.appendChild(sec)});
function checkCode(i){let c=document.getElementById('code'+i).value,f=document.getElementById('cf'+i);if(lessons[i].check(c)){if(!codeDone.has(i)){codeDone.add(i);codeEarned+=5}f.innerHTML='✓ '+lessons[i].pass;return}f.innerHTML='Not quite. '+lessons[i].hint}
function go(i){document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('active'));document.getElementById('l'+i).classList.add('active');scrollTo(0,0)}
function finish(){let earned=mcEarned+codeEarned,pct=(earned/totalPoints*100).toFixed(1);let name=document.getElementById('student').value.trim(),period=document.getElementById('period').value;app.innerHTML=`<div class="card"><h2>Chapter 9 Practice Results</h2><div class="scorebox"><div>Points: <b>${earned} / ${totalPoints}</b></div><div>Final Grade: <b>${pct}%</b></div></div><p>Multiple Choice: ${mcEarned}/80 &nbsp; | &nbsp; Coding: ${codeEarned}/20</p>${done.size<20||codeDone.size<4?'<div class="note">You can submit this score, but some questions or coding checks are incomplete. Use Restart Lab if you need to finish them.</div>':''}<button class="codebtn" onclick="submitGrade('${pct}')">Submit My Grade</button><div id="submitOk" class="submit-ok">✓ Your grade has been submitted.</div><button class="codebtn" onclick="location.reload()">Restart Lab</button></div>`;window.savedName=name;window.savedPeriod=period}
function submitGrade(pct){let name=window.savedName||'',period=window.savedPeriod||'';if(!name||!period){alert('Please enter your first and last name and class period before submitting. Click Restart Lab, enter the information at the top, then return to the results page.');return}let form=document.createElement('form');form.action='https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse';form.method='POST';form.target='gradeTarget';form.style.display='none';[['entry.2089413779',name],['entry.890934651',period],['entry.646173439','Chapter 09 | Lists'],['entry.962158861',pct+'%']].forEach(([n,v])=>{let inp=document.createElement('input');inp.name=n;inp.value=v;form.appendChild(inp)});document.body.appendChild(form);form.submit();document.getElementById('submitOk').style.display='block';document.querySelectorAll('.codebtn')[0].disabled=true;setTimeout(()=>form.remove(),2000)}
</script></body></html>
