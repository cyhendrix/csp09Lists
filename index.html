<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 9 Lists Practice Lab</title>
<style>
:root{--p:#4f2d7f;--g:#f5b924;--bg:#f7f5fb;--ok:#e7f6e6;--bad:#fde8e8;--ink:#20232a}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}.head{background:var(--p);color:#fff;padding:22px;border-bottom:6px solid var(--g)}.wrap{max-width:1020px;margin:auto;padding:20px}.card{background:#fff;margin:18px 0;padding:20px;border-radius:16px;box-shadow:0 3px 12px #0001}.student{border:3px solid var(--g)}label{font-weight:bold}input,select{padding:10px;border:2px solid var(--p);border-radius:8px;font-size:16px;margin:6px}.lesson{display:none}.lesson.active{display:block}.q{border-left:6px solid var(--p);padding:14px;margin:16px 0;background:#faf9fd}.opts button,.nav button,.codebtn{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.correct{background:var(--ok)!important;border-color:#3a9b43!important}.wrong{background:var(--bad)!important;border-color:#c74a4a!important}.feedback{font-weight:bold;margin-top:8px}.purple{background:var(--p);color:#fff;border:3px solid var(--g);padding:15px;border-radius:12px}.purple textarea{width:100%;min-height:180px;font:15px Consolas,monospace;padding:12px;border-radius:9px}.nav{display:flex;gap:12px;margin-top:18px}.nav button,.codebtn{background:var(--p);color:#fff;border-color:var(--g);text-align:center;font-weight:bold}.pill{display:inline-block;background:var(--g);padding:5px 10px;border-radius:99px;font-weight:bold}.small{font-size:14px}.submit-ok{padding:12px;border-radius:10px;background:var(--ok);font-weight:bold;display:none}.scorebox{font-size:28px;text-align:center;padding:18px}.note{background:#fff4d6;border-left:5px solid var(--g);padding:10px;margin:10px 0;color:#20232a}.purple .retry-note{background:#fff4d6;color:#20232a!important}.q pre{background:#f1eef7;border:1px solid #c9b9df;border-radius:8px;padding:10px;white-space:pre-wrap;font:15px Consolas,monospace;margin:10px 0;color:#35175f;font-weight:bold}.purple .feedback{background:#fff;color:#20232a;padding:10px 12px;border-radius:8px;margin-top:10px}.purple textarea:disabled{background:#f4f4f4;color:#222;opacity:1}.codebtn:disabled{opacity:.65;cursor:not-allowed}</style></head><body>
<div class="head"><div class="wrap"><h1>Chapter 9 — Lists Practice Lab</h1><p>Lists • Tuples • List Functions • Iteration • Sequential & Binary Search</p></div></div>
<main class="wrap"><div class="card student"><h2>Student Information</h2><label>First and Last Name <input id="student" size="28" placeholder="First Last"></label><label>Class Period <select id="period"><option value="">Choose...</option><option>1st Block</option><option>2nd Block</option><option>3rd Block</option><option>4th Block</option></select></label></div><div id="app"></div></main><iframe name="gradeTarget" style="display:none"></iframe>
<script>
const lessons=[
{title:'Lesson 1 — Lists & Tuples',qs:[['Which code correctly creates a list named marbles containing red, green, and blue?',['marbles = ["red", "green", "blue"]','marbles = ("red", "green", "blue")','marbles = [red, green, blue]','marbles = list.create("red", "green", "blue")'],'marbles = ["red", "green", "blue"]','Correct! Python lists use square brackets, and string values need quotation marks.','Lists use [ ]. A tuple uses ( ).'],['Which data types can a Python list store?',['Integers only','Strings only','Booleans only','Integers, strings, Booleans, and even mixed types'],'Integers, strings, Booleans, and even mixed types','Correct! Python lists can hold mixed data types.','Python lists are flexible.'],['Given marbles = ["red","green","blue"], what does marbles[1] return?',['red','green','blue','1'],'green','Correct! Index 1 is the second item.','Indexes start at 0.'],['Look at the code below:<br><pre><code>marbles = ["red", "green", "blue"]\nmarbles[1] = "yellow"\nprint(marbles)</code></pre>What will be printed?',['["red","yellow","blue"]','["yellow","green","blue"]','["red","green","yellow"]','The list cannot be changed'],'["red","yellow","blue"]','Correct! Index 1 is green, so it is replaced by yellow.','Trace the indexes: 0=red, 1=green, 2=blue.'],['Look at the list and indexes:<br><pre><code>marbles = ["red", "green", "blue", "yellow", "black", "white"]\n# indexes:     0       1        2       3         4       5\nprint(marbles[2:5])</code></pre>Which items print?',['["blue","yellow","black"]','["green","blue","yellow"]','["blue","yellow","black","white"]','["yellow","black"]'],'["blue","yellow","black"]','Correct! The slice includes 2,3,4 and stops before 5.','Start at 2 and stop BEFORE 5.']],scenario:'Create a list named <b>myHobbies</b> with at least 3 string items. Print the second item. Change the third item to "guitar", then print the first two items using a slice.',check:c=>/myHobbies\s*=\s*\[[^\]]+\]/.test(c)&&/print\s*\(\s*myHobbies\s*\[\s*1\s*\]/.test(c)&&/myHobbies\s*\[\s*2\s*\]\s*=\s*["']guitar["']/.test(c)&&/myHobbies\s*\[\s*0?\s*:\s*2\s*\]/.test(c),pass:'Great! You used a list, indexes, and a slice correctly.',hint:'Use myHobbies = [...], print(myHobbies[1]), myHobbies[2] = "guitar", and print(myHobbies[0:2]).'},
{title:'Lesson 2 — List Functions',qs:[['Which expression returns the number of items in marbles?',['len(marbles)','marbles.length','marbles.size()','size(marbles)'],'len(marbles)','Correct! len() returns the number of items.','Use len().'],['Which statement adds "yellow" to the END?',['marbles.append("yellow")','marbles.insert(0,"yellow")','marbles.pop("yellow")','marbles.add("yellow")'],'marbles.append("yellow")','Correct! append() adds to the end.','Use append().'],['Which method removes all items?',['clear()','pop()','remove()','delete()'],'clear()','Correct! clear() empties the list.','Use clear().'],['Which removes an item at an index AND returns it?',['pop(index)','remove(value)','clear()','reverse()'],'pop(index)','Correct! pop(index).','Think pop.'],['What does "green" in marbles return?',['Boolean True','string green','integer 1','a one-item list'],'Boolean True','Correct! in returns a Boolean.','It answers True or False.']],scenario:'Write the complete program: create <code>colors = ["red", "green", "blue"]</code>, append "yellow", pop index 0 into <code>removed</code>, and print whether "green" is in colors.',check:c=>/colors\s*=\s*\[/.test(c)&&/colors\.append\s*\(\s*["']yellow["']/.test(c)&&/removed\s*=\s*colors\.pop\s*\(\s*0/.test(c)&&/["']green["']\s+in\s+colors/.test(c),pass:'Nice! You used append(), pop(), and in correctly.',hint:'Include the starting colors list, colors.append("yellow"), removed = colors.pop(0), and print("green" in colors).'},
{title:'Lesson 3 — Iterating Over Lists',qs:[['Look at the list and loop below:<br><pre><code>marbles = ["red", "blue", "green"]\n\nfor marble in marbles:\n    print(marble)</code></pre>The variable <code>marble</code> gives each VALUE. What information does this loop <b>NOT automatically give you</b>?',['The numeric index (0, 1, 2, ...) of each item','The value stored in each item','The ability to print each item','The ability to visit every item'],'The numeric index (0, 1, 2, ...) of each item','Correct! It gives each value, but not its numeric index.','marble contains red, then blue, then green—not the position number.'],['Which loop visits every valid numeric index in marbles?',['for i in range(0,len(marbles)):','for i in marbles:','for i in [0,len(marbles)]:','while(marbles):'],'for i in range(0,len(marbles)):','Correct! range gives indexes 0 through len-1.','range stops before len(marbles).'],['For marbles=["red","blue","green","orange","yellow"], what prints for range(2,4)?',['green orange','blue green','green orange yellow','red blue green'],'green orange','Correct! It uses indexes 2 and 3.','4 is not included.'],['What indexes are used by range(0,len(marbles),3) for a 5-item list?',['0 and 3','0,1,2','3 and 4','0,3,6'],'0 and 3','Correct! Start 0, jump by 3.','The third value is the step.'],['Look at this code:<br><pre><code>esports = ["Donkey Kong", "Galaga", "Pac Man"]\nfor sport in esports:\n    sport = "Centipede"\nprint(esports)</code></pre>Why is the original list unchanged?',['sport is only the loop variable; changing it does not assign to esports[index]','Lists cannot be changed','Strings cannot be changed','for loops cannot update list items'],'sport is only the loop variable; changing it does not assign to esports[index]','Correct! To change the list, assign to esports[i].','The code changes sport, not esports[i].']],scenario:'Create <code>colors = ["red","blue","green"]</code>. Use a numeric-index loop to change every item in the list to "purple". Print the final list.',check:c=>/colors\s*=\s*\[/.test(c)&&/for\s+\w+\s+in\s+range\s*\(\s*0\s*,\s*len\s*\(\s*colors\s*\)/.test(c)&&/colors\s*\[\s*\w+\s*\]\s*=\s*["']purple["']/.test(c)&&/print\s*\(\s*colors\s*\)/.test(c),pass:'Correct! Numeric-index traversal changed the actual list items.',hint:'Use for i in range(0, len(colors)): then colors[i] = "purple", followed by print(colors).'},
{title:'Lesson 4 — Sequential & Binary Search',qs:[['Which search works on unsorted data?',['Sequential search','Binary search','Both','Neither'],'Sequential search','Correct! Sequential search works on unsorted data.','Binary search requires sorted data.'],['What looping structure best describes sequential search?',['A single for loop','Nested for loops','An outer while plus inner for','Only if statements'],'A single for loop','Correct!','Check items one at a time.'],['How does binary search improve performance?',['It discards half of the remaining possible elements after each comparison','It checks every item faster','It sorts every pass','It uses random indexes'],'It discards half of the remaining possible elements after each comparison','Correct!','It halves the search area.'],['What is the middle-index formula?',['(highIndex + lowIndex) // 2','highIndex - lowIndex','lowIndex + 1','highIndex / 2'],'(highIndex + lowIndex) // 2','Correct!','Use both boundaries and integer division.'],['<b>Binary Search — Which Half Should We Keep?</b><br>Binary search works with a <b>sorted list</b>. Suppose you are searching for the target <b>5</b>, but the middle value is <b>8</b>.<br><pre><code>numbers = [1, 3, 5, 6, 8, 9, 10, 12, 14, 15]\n                       ↑\n                  middle value</code></pre>Since 8 is greater than the target 5, the target must be somewhere to the <b>LEFT</b> of 8. Which line of code moves the <b>high end of the search area to the left</b>?',['highIndex = middleIndex - 1','lowIndex = middleIndex + 1','highIndex = middleIndex + 1','Stop searching'],'highIndex = middleIndex - 1','Correct! Because the middle value 8 is too high, the target 5 must be on the left. Setting highIndex = middleIndex - 1 removes the middle item and everything to its right from the search area.','The list is sorted. You are looking for 5 but landed on 8. Since 5 is smaller than 8, move the HIGH boundary to the left: highIndex = middleIndex - 1.']],scenario:'Write a sequential search for <code>numbers = [15, 9, 1, 14, 12, 8]</code> that searches for target 12. Use a numeric-index for loop. When found, print the index and break.',check:c=>/numbers\s*=\s*\[/.test(c)&&/target\s*=\s*12/.test(c)&&/for\s+\w+\s+in\s+range/.test(c)&&/numbers\s*\[\s*\w+\s*\]\s*==\s*target/.test(c)&&/break/.test(c),pass:'Great! Your sequential search finds 12 at index 4.',hint:'Use for i in range(0, len(numbers)), compare numbers[i] to target, print i, and break.'}];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}let mcEarned=0,codeEarned=0;const totalPoints=100;let done=new Set(),codeDone=new Set();const app=document.getElementById('app');
lessons.forEach((L,li)=>{let sec=document.createElement('section');sec.className='lesson card'+(li===0?' active':'');sec.id='l'+li;sec.innerHTML=`<span class="pill">Lesson ${li+1}</span><h2>${L.title}</h2><p>Each multiple-choice question is worth 4 points. The coding check is worth 5 points.</p>`;L.qs.forEach((q,qi)=>{let id=`${li}-${qi}`,d=document.createElement('div');d.className='q';d.innerHTML=`<b>${qi+1}. ${q[0]}</b><div class="opts"></div><div class="feedback"></div>`;let opts=d.querySelector('.opts');shuffle(q[1]).forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(done.has(id))return;if(o===q[2]){b.classList.add('correct');d.querySelector('.feedback').textContent='✓ '+q[3];done.add(id);mcEarned+=4;Array.from(opts.children).forEach(x=>x.disabled=true)}else{b.classList.add('wrong');d.querySelector('.feedback').textContent='✗ '+q[4]+' Try again.';setTimeout(()=>b.classList.remove('wrong'),700)}};opts.appendChild(b)});sec.appendChild(d)});let c=document.createElement('div');c.className='purple';c.innerHTML=`<h3>Coding Check — 5 points</h3><p>${L.scenario}</p><div class="note retry-note"><b>Retry allowed:</b> If your code is not correct, fix it in the box and click <b>Check My Code</b> again. You may retry until it passes.</div><textarea id="code${li}" placeholder="Type your complete Python code here..."></textarea><button id="cb${li}" class="codebtn" onclick="checkCode(${li})">Check My Code</button><div id="cf${li}" class="feedback"></div>`;sec.appendChild(c);let nav=document.createElement('div');nav.className='nav';if(li>0)nav.innerHTML+=`<button onclick="go(${li-1})">← Previous</button>`;nav.innerHTML+=li<3?`<button onclick="go(${li+1})">Next Lesson →</button>`:`<button onclick="finish()">Finish & See Results</button>`;sec.appendChild(nav);app.appendChild(sec)});
function checkCode(i){let box=document.getElementById('code'+i),btn=document.getElementById('cb'+i),c=box.value,f=document.getElementById('cf'+i);if(codeDone.has(i))return;if(lessons[i].check(c)){codeDone.add(i);codeEarned+=5;f.innerHTML='✓ '+lessons[i].pass+' <b>Coding check complete — 5/5 points.</b>';box.disabled=true;btn.disabled=true}else{f.innerHTML='✗ Not quite. '+lessons[i].hint+'<br><b>Fix your code above, then click Check My Code again. You can retry as many times as needed.</b>';box.focus()}}
function go(i){document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('active'));document.getElementById('l'+i).classList.add('active');scrollTo(0,0)}
function finish(){let earned=mcEarned+codeEarned,pct=(earned/totalPoints*100).toFixed(1);let name=document.getElementById('student').value.trim(),period=document.getElementById('period').value;app.innerHTML=`<div class="card"><h2>Chapter 9 Practice Results</h2><div class="scorebox">Points: <b>${earned} / ${totalPoints}</b><br>Final Grade: <b>${pct}%</b></div><button class="codebtn" onclick="submitGrade('${pct}')">Submit My Grade</button><div id="submitOk" class="submit-ok">✓ Your grade has been submitted.</div></div>`;window.savedName=name;window.savedPeriod=period}
function submitGrade(pct){let form=document.createElement('form');form.action='https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse';form.method='POST';form.target='gradeTarget';form.style.display='none';[['entry.2089413779',window.savedName||''],['entry.890934651',window.savedPeriod||''],['entry.646173439','Chapter 09 | Lists'],['entry.962158861',pct+'%']].forEach(([n,v])=>{let x=document.createElement('input');x.name=n;x.value=v;form.appendChild(x)});document.body.appendChild(form);form.submit();document.getElementById('submitOk').style.display='block'}
</script></body></html>
